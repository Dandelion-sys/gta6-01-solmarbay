<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solmar Bay — an open-world crime story</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0b1e33;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #fff; }
  #game { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; }
  #hud-money { position: absolute; top: 14px; left: 16px; font-size: 28px;
    font-weight: 800; color: #7dff9a; text-shadow: 0 2px 6px #000; }
  #hud-health { position: absolute; top: 50px; left: 16px; font-size: 16px;
    text-shadow: 0 2px 4px #000; }
  #hud-stars { position: absolute; top: 14px; right: 16px; font-size: 26px;
    letter-spacing: 3px; text-shadow: 0 2px 6px #000; }
  #hud-clock { position: absolute; top: 50px; right: 16px; font-size: 15px;
    text-shadow: 0 2px 4px #000; text-align: right; }
  #hud-objective { position: absolute; top: 90px; left: 16px; max-width: 420px;
    font-size: 15px; background: rgba(0,0,0,.45); padding: 8px 12px;
    border-left: 4px solid #ffd94d; border-radius: 4px; }
  #hud-context { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-size: 15px; background: rgba(0,0,0,.55); padding: 7px 14px; border-radius: 20px; }
  #hud-char { position: absolute; bottom: 18px; left: 16px; font-size: 15px;
    font-weight: 700; background: rgba(0,0,0,.55); padding: 7px 12px; border-radius: 6px; }
  #hud-focus { position: absolute; bottom: 52px; left: 16px; font-size: 13px;
    text-shadow: 0 2px 4px #000; }
  #hud-radio { position: absolute; bottom: 86px; left: 16px; font-size: 13px;
    color: #ffd94d; text-shadow: 0 2px 4px #000; }
  #hud-toast { position: absolute; top: 150px; left: 50%; transform: translateX(-50%);
    font-size: 17px; background: rgba(0,0,0,.65); padding: 9px 18px; border-radius: 6px;
    transition: opacity .4s; }
  #minimap-wrap { position: absolute; right: 16px; bottom: 16px;
    border: 2px solid rgba(255,255,255,.7); border-radius: 6px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.5); }
  #briefing { position: absolute; top: 22%; left: 50%; transform: translateX(-50%);
    width: 460px; max-width: 90vw; background: rgba(10,20,35,.92); padding: 20px 24px;
    border: 1px solid #ffd94d; border-radius: 8px; pointer-events: auto; }
  #briefing h2 { margin: 0 0 8px; color: #ffd94d; }
  #briefing button { margin-top: 12px; }
  #title, #pause, #gameover { position: fixed; inset: 0; z-index: 10; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(8,30,55,.55), rgba(8,30,55,.28));
    text-align: center; padding: 0 24px; box-sizing: border-box; }
  #title h1, #pause h1, #gameover h1 { font-size: 64px; letter-spacing: 6px;
    margin: 0; color: #ffd94d; text-shadow: 0 4px 18px #000; }
  #title .tag { font-size: 18px; max-width: 560px; }
  #title .chars { font-size: 16px; color: #9fd8ff; }
  #title button, #pause button, #gameover button, #briefing button {
    pointer-events: auto; font-size: 18px; padding: 12px 26px; margin: 8px;
    background: #ffd94d; color: #122; border: none; border-radius: 8px;
    font-weight: 700; cursor: pointer; }
  #title button:hover, #pause button:hover { background: #ffe98a; }
  .keys { margin-top: 22px; font-size: 14px; line-height: 1.9; color: #dfe9f2;
    background: rgba(0,0,0,.4); padding: 12px 20px; border-radius: 8px; }
  .keys b { color: #ffd94d; }
  #title .best { margin-top: 14px; color: #7dff9a; }
  #bigmap { position: fixed; inset: 0; z-index: 8; display: flex;
    align-items: center; justify-content: center; background: rgba(0,0,0,.6); }
  #bigmap-canvas { border: 2px solid #ffd94d; border-radius: 8px; }
  #phone { position: absolute; right: 210px; top: 90px; width: 300px; min-height: 420px;
    background: rgba(15,25,40,.95); border: 2px solid #444; border-radius: 18px;
    padding: 14px; pointer-events: auto; z-index: 6; font-size: 14px; }
  #phone .phone-top { font-weight: 800; color: #ffd94d; margin-bottom: 10px; }
  #phone button { display: block; width: 100%; margin: 6px 0; padding: 9px;
    background: #22405e; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  #phone button:hover { background: #2e6fb0; }
  #shot-tag { position: fixed; left: 16px; bottom: 120px; z-index: 9;
    background: rgba(0,0,0,.6); color: #ffd94d; font-size: 13px; font-weight: 700;
    letter-spacing: 2px; padding: 6px 12px; border-radius: 4px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="title"></div>
<div id="pause" style="display:none"></div>
<div id="gameover" style="display:none"></div>
<div id="bigmap" style="display:none"><canvas id="bigmap-canvas" width="600" height="500"></canvas></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/boot.js"></script>
</body>
</html>
