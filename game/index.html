<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Solmar Bay — Open World</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1c2c;
    font-family: "Trebuchet MS", Verdana, sans-serif; touch-action: none;
    -webkit-user-select: none; user-select: none; }
  #app { position: fixed; inset: 0; }
  canvas.game { display: block; width: 100%; height: 100%; }
  .hidden { display: none !important; }
  /* Small (phone) screens: keep the HUD, minimap and toasts clear of the
     touch joystick and buttons, which live in the bottom corners. */
  @media (max-width: 600px) {
    #minimap { width: 108px !important; height: 108px !important; }
    #hud-money { font-size: 20px !important; }
    #hud-hero, #hud-clock { font-size: 12px !important; }
    #hud-bars { width: 130px !important; }
    #hud-stars { font-size: 16px !important; }
    #hud-objective { bottom: 172px !important; max-width: 62vw !important;
      font-size: 12px !important; padding: 6px 9px !important; }
    #hud-context { bottom: 236px !important; font-size: 13px !important;
      max-width: 56vw; text-align: center; }
    #hud-speed { bottom: 172px !important; font-size: 18px !important; }
    #hud-toast { top: 22% !important; max-width: 82vw; font-size: 14px !important;
      text-align: center; }
    #phone { width: 320px !important; height: 480px !important; right: 8px !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/boot.js"></script>
</body>
</html>
